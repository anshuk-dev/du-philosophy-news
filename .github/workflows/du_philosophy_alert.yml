name: DU Philosophy Faculty Vacancy Alert

on:
  schedule:
    # Runs 3 times a day: 03:30, 09:30, 15:30 UTC (approx 9:00 AM, 3:00 PM, 9:00 PM IST)
    - cron: '30 3,9,15 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write
  issues: write

jobs:
  track-vacancies:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Run DU Philosophy Vacancy Tracker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL || 'anshu.philosophy@gmail.com' }}
        run: |
          python tracker.py

      - name: 💾 Commit and Push Updated History & Dashboard
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add notices_history.json README.md
          git diff --staged --quiet || (git commit -m "Auto-update: Latest DU Philosophy vacancies [skip ci]" && git push)
